<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence explorer — baseline fixture</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #20232a;
      --surface: #ffffff;
      --accent: #0645ad;
      --line: #727985;
      --focus: #0645ad;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f0f2f5; --surface: #17191e; --accent: #9abaff; --line: #a6acb6; --focus: #9abaff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--surface); font: 16px/1.5 system-ui, sans-serif; }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); }
    main { max-width: 70rem; margin: auto; padding: 1.5rem; }
    .columns { display: grid; grid-template-columns: minmax(12rem, 1fr) 2fr; gap: 1.5rem; }
    nav, section { padding: 1rem; border: 1px solid var(--line); border-radius: .5rem; }
    nav a { display: block; color: var(--accent); margin: .5rem 0; }
    button { min-width: 2rem; min-height: 2rem; padding: .5rem 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 48rem) { .columns { grid-template-columns: 1fr; } }
    @media (forced-colors: active) { :focus-visible { outline-color: Highlight; } }
  </style>
</head>
<body>
  <header><strong>Evidence explorer</strong></header>
  <main>
    <h1>Review storage evidence</h1>
    <div class="columns">
      <nav aria-label="Evidence groups">
        <h2>Groups</h2>
        <a href="#recent">Recent</a>
        <a href="#review">Needs review</a>
      </nav>
      <section id="review">
        <h2>Needs review</h2>
        <p>Three items need a decision. Their space use is not a removal recommendation.</p>
        <button type="button" id="open-error">Open held-out error case</button>
        <p id="error" role="alert" hidden>The item cannot be displayed. Its data remains unchanged.</p>
      </section>
    </div>
  </main>
  <script>
    document.getElementById("open-error").addEventListener("click", () => {
      document.getElementById("error").hidden = false;
    });
  </script>
</body>
</html>
